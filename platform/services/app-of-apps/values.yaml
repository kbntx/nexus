      project: default
      source:
        repoURL: https://github.com/kbntx-org/nexus.git
        path: platform/core/renovate
        targetRevision: main
        helm:
          parameters:
            - name: gitRevision
              value: $ARGOCD_APP_REVISION
      destination:
