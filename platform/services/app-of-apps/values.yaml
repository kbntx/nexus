    documentation:
      project: default
      sources:
        - repoURL: https://github.com/kbntx-org/nexus.git
          path: docs/helm
          targetRevision: main
          helm:
            valueFiles:
              - values.yaml
              - $values/documentation/values.yaml
        - repoURL: https://github.com/kbntx-org/nexus-manifests.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: documentation
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

