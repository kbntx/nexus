apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: renovate
spec:
  template:
    metadata:
      labels:
        pool: renovate
        k3s.sh/plan-exclude: 'true'
    spec:
      nodeClassRef:
        group: karpenter.hetzner.cloud
        kind: HCloudNodeClass
        name: renovate
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ['cx32', 'cpx32']
        - key: topology.kubernetes.io/zone
          operator: In
          values: [nbg1, fsn1, hel1]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ['on-demand']
      startupTaints:
        - key: node.cilium.io/agent-not-ready
          value: "true"
          effect: NoSchedule
      taints:
        - key: renovate
          value: 'true'
          effect: NoSchedule
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1m
---
apiVersion: karpenter.hetzner.cloud/v1
kind: HCloudNodeClass
metadata:
  name: renovate
spec:
  locations: [nbg1, fsn1, hel1]
  networkID: 11317690
  imageSelector:
    family: ubuntu
    version: '24.04'
  sshKeyIDs:
    # dummy-karpenter ssh key — Hetzner emails the root otherwise
    - 117687226
  placementGroupStrategy: spread
  enablePublicIPv4: true
  enablePublicIPv6: false
  labels:
    managed-by: karpenter
    pool: renovate
    type: worker
    cluster-name: nexus
  userDataSecretRef:
    namespace: {{ .Release.Namespace }}
    name: renovate-userdata
    key: userData
