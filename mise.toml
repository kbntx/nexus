min_version = "2026.9.1"

[settings]
lockfile = true
locked = true
minimum_release_age = "14d"

[tools]
node = "24.15.0"
pnpm = "11.24.0"
go = "1.27.0"
terraform = "1.15.9"
kind = "0.33.0"
tilt = "0.37.7"
kubectl = "1.36.4"
mkcert = "1.4.4"
github-cli = "2.100.0"
helm = "3.15.3"
python = "3.14.7"
uv = "0.12.5"
yq = "4.53.6"


[tasks."lock:update"]
run = "mise install"
env = { MISE_LOCKED = "0" }

[tasks."cluster"]
description = "Manage the local kind cluster, registry, and buildx builder (create|delete|recreate)"
run = "bash platform/core/local/local.sh \"${1:?Usage: mise run cluster <create|delete|recreate>}\""

[tasks."dev"]
description = "tilt up an app alongside core infra (docs|kiln|portfolio)"
run = "tilt up -- \"${1:?Usage: mise run dev <docs|kiln|portfolio>}\""
